# Deploy the Supervision CRM as its OWN Netlify site (it's a Vite build, not a static folder).
# In Netlify: Add new site -> Import this repo -> set "Base directory" to: supervision-crm
# Netlify then reads this file; command + publish below are relative to that base directory.
# Supabase env is baked in via .env.production, so no dashboard environment setup is required.
[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # No `ignore` rule: it reported skipped builds as "Canceled" and blocked redeploys of the same
  # commit (git diff of a commit against itself is empty), so the site never updated.

[build.environment]
  NODE_VERSION = "20"
