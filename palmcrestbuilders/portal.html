<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unlisted: keep out of search results. Not linked in nav or sitemap either. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Palm Crest — Staff Portal</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel-2: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --line: #334155;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }
    .head { text-align: center; margin-bottom: 32px; }
    .head h1 { font-size: 30px; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 15px; margin: 0 auto; max-width: 520px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card {
      display: block; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px; transition: transform .08s ease, border-color .15s ease;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
    a.card:active { transform: translateY(0); }
    .card .icon { font-size: 30px; }
    .card .name { font-size: 19px; font-weight: 700; margin-top: 10px; }
    .card .desc { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.45; }
    .card .cta { margin-top: 16px; font-weight: 600; color: var(--accent); font-size: 15px; }
    .card-todo { opacity: .6; }
    .card-todo .cta { color: var(--muted); }
    .foot { margin-top: 34px; text-align: center; color: var(--muted); font-size: 13px; }
    .foot code { background: var(--panel-2); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Staff Portal</h1>
      <p class="sub">Private tools for Palm Crest staff. Reachable by direct link only — please don't share publicly. Each tool has its own login.</p>
    </header>

    <section id="tools" class="grid"></section>

    <footer class="foot">
      <p>To change a link, edit the <code>TOOLS</code> list near the bottom of <code>portal.html</code>.</p>
    </footer>
  </main>

  <script>
    // Edit these after you deploy each tool. Leave a "REPLACE…" placeholder and the
    // card shows as "Not set up yet" instead of a broken link.
    const TOOLS = [
      { name: "Telemarketer Dialer", icon: "📞", desc: "Work call campaigns on the iPad.", url: "https://palmcrest-dialer.netlify.app/" },
      { name: "Supervision CRM",     icon: "📊", desc: "Monitor leads and job progress.",  url: "https://REPLACE-with-your-CRM-URL" },
      { name: "Photo Uploader",      icon: "🖼️", desc: "Add job photos to the gallery.",   url: "/admin/" },
    ];

    const grid = document.getElementById("tools");
    TOOLS.forEach((t) => {
      const configured = !/REPLACE/i.test(t.url);
      const card = document.createElement(configured ? "a" : "div");
      card.className = "card" + (configured ? "" : " card-todo");
      if (configured) {
        card.href = t.url;
        if (/^https?:/i.test(t.url)) { card.target = "_blank"; card.rel = "noopener"; }
      }
      const icon = document.createElement("div"); icon.className = "icon"; icon.textContent = t.icon;
      const name = document.createElement("div"); name.className = "name"; name.textContent = t.name;
      const desc = document.createElement("div"); desc.className = "desc"; desc.textContent = t.desc;
      const cta  = document.createElement("div"); cta.className  = "cta";  cta.textContent  = configured ? "Open →" : "Not set up yet";
      card.append(icon, name, desc, cta);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
