# Deploy the CRM as its OWN Netlify site.
# In Netlify: Add new project -> Import from GitHub -> pick this repo -> set
# "Base directory" to: crm
[build]
  publish = "."
  command = "echo 'Static app — no build step'"
  # Skip this site's deploy when nothing in its base directory changed (saves build credits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
